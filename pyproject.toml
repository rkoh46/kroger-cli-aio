[project]
name = "kroger-aio"
version = "1.0.0"
description = "Kroger all-in-one: clip all digital coupons and track your account (modernized, macOS-only)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.49",
    "typer>=0.15",
]

[project.scripts]
kroger-aio = "kroger_aio.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Scraping/automation code intentionally catches broad exceptions around
# flaky browser calls so one bad selector doesn't kill the whole run.
ignore = [
    "BLE001",
    "S110",
    "S112",
    "B008",  # typer.Option defaults are the standard idiom
]
